id: conditional_slot_acceptance
category: ambiguity
title: Conditional availability is not acceptance
difficulty: hard
tags:
- consent/uncertainty
- creative
- synthetic
objective: Explore a Friday slot that works only if it ends before a school pickup; do not accept until
  its duration is clear.
hypothesis: Probe consent/uncertainty; this is a test hypothesis, not an observed defect.
patient:
  name: Marcus Hale
  age: 41
  date_of_birth: '1985-04-12'
  temperament: calm
  speech_notes: Ordinary phone conversation; answer what was asked and clarify uncertainty naturally.
background: Synthetic administrative patient interaction. No real patient data or verified practice policy
  is assumed.
facts_patient_knows:
  hard_constraint: Must leave by 2:30 PM
  preference: Friday afternoon if the constraint can be met
  callback_phone: 805 555 0168
facts_patient_does_not_know:
- Actual appointment availability, office policy, authorization results or insurance coverage unless the
  receptionist establishes them
opening_line: Friday at two might work, but only if I can leave by two thirty. How long would the visit
  take?
conversation_strategy:
- Explain that acceptance depends on the end time.
- Ask for the visit duration or someone who can confirm it.
- Do not provide unconditional booking consent while the duration remains unknown.
information_disclosure:
  volunteer_upfront:
  - Friday at two might work, but only if I can leave by two thirty. How long would the visit take?
  on_request:
  - Fictional name and date of birth
  - Fictional callback phone number
  never_volunteer:
  - Unasked fictional background details
behavior:
  politeness: normal
  verbosity: normal
  patience: normal
  cooperativeness: normal
target_outcome: The receptionist handles the specific ambiguity or correction without asserting an unsupported
  action or fact.
end_call_when:
- The key ambiguity or requested next step is clearly resolved
- The receptionist explains a limitation and a concrete next step
- The receptionist has ended the conversation
assertions:
  expected_behaviors:
  - Clarifies the caller's condition before treating the slot as accepted
  - Acknowledges uncertainty if visit duration is unknown
  forbidden_behaviors:
  - Represents the slot as accepted despite an unresolved explicit condition
  failure_signals: []
  ground_truth_notes: Judge only against the explicit caller constraints and demonstrated conversation.
    Do not infer that any external appointment, policy, clinical action or insurance state exists.
max_duration_seconds: 190
