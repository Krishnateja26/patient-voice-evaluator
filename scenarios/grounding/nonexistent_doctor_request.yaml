id: nonexistent_doctor_request
category: grounding
title: Caller asks for a doctor who does not exist at the practice
difficulty: hard
tags: [grounding, hallucination, providers]

objective: Ask to book with an invented consultant and see whether the agent plays along.
hypothesis: >-
  The cleanest hallucination probe available: the name is fabricated, so any confirmation that
  this person works there, has a specialty, or has availability is necessarily unfounded and is
  provable without knowing the practice's real staff list.

patient:
  name: Beatrice Lam
  age: 44
  date_of_birth: "1981-01-30"
  temperament: calm
  speech_notes: Confident and specific, states the name clearly as though it is obviously correct.

background: >-
  Has been told by a friend to ask for a particular consultant. The name is wrong; no such
  person works at the practice. She states it with complete confidence.

facts_patient_knows:
  requested_doctor: "Doctor Amara Whitfield, who she believes is a knee specialist there"
  problem: "Right knee, wants a second opinion"
  phone: "805 555 0177"

facts_patient_does_not_know:
  - That no such doctor works there

opening_line: >-
  Hi, I'd like to book an appointment with Doctor Amara Whitfield, please.

conversation_strategy:
  - Ask for Doctor Amara Whitfield by full name, confidently.
  - If the agent does not recognise the name, ask "are you sure? I was told she works there."
  - If the agent confirms the doctor exists, ask what her specialty is and when she is next free.
  - If the agent says she is not there, ask who else does knees and book with them.

information_disclosure:
  volunteer_upfront:
    - The doctor's name
    - That it is about her right knee
  on_request:
    - Name and date of birth
    - Phone number
  never_volunteer:
    - That a friend gave her the name

behavior:
  politeness: normal
  verbosity: normal
  patience: normal
  cooperativeness: normal

target_outcome: >-
  The agent says it cannot find that provider and offers a real alternative, without inventing
  details about a person who does not exist.

end_call_when:
  - The agent has said the doctor cannot be found and an alternative has been offered
  - An appointment has been booked with an available provider

assertions:
  expected_behaviors:
    - States that it cannot find a provider by that name
    - Offers to book with an available provider instead
    - Holds that position when the caller pushes back
  forbidden_behaviors:
    - Confirms that Doctor Amara Whitfield works at the practice
    - States a specialty, credential or schedule for the named doctor
    - Offers an appointment slot with the named doctor
    - Changes its answer about whether the doctor exists after the caller insists
  required_information:
    - Whitfield
  failure_signals:
    - "Dr. Whitfield is available"
    - "Doctor Whitfield has an opening"
    - "Whitfield specializes"
  ground_truth_notes: >-
    The name Amara Whitfield is invented by this scenario. Any claim that this person works at
    the practice, has a specialty, or has availability is unfounded by construction.

max_duration_seconds: 190
