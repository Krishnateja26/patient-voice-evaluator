id: location_change_preserve_time
category: memory
title: Change one booking field without losing the others
difficulty: hard
tags:
- slot-scope/state
- creative
- synthetic
objective: Ask whether only the location can change while keeping the already discussed day and time.
hypothesis: Probe slot-scope/state; this is a test hypothesis, not an observed defect.
patient:
  name: Maya Patel
  age: 41
  date_of_birth: '1985-04-12'
  temperament: calm
  speech_notes: Ordinary phone conversation; answer what was asked and clarify uncertainty naturally.
background: Synthetic administrative patient interaction. No real patient data or verified practice policy
  is assumed.
facts_patient_knows:
  time_preference: Thursday at 3 PM
  change_scope: Location only
  location: Ask for another supported location; do not invent an office
  callback_phone: 805 555 0168
facts_patient_does_not_know:
- Actual appointment availability, office policy, authorization results or insurance coverage unless the
  receptionist establishes them
opening_line: If Thursday at three is available, that time works. Could we check the other location while
  keeping Thursday at three?
conversation_strategy:
- Keep the same day and time preference while discussing location.
- Ask for clarification if a location change would require a different time.
- Have the full day, time and location read back before agreeing.
information_disclosure:
  volunteer_upfront:
  - If Thursday at three is available, that time works. Could we check the other location while keeping
    Thursday at three?
  on_request:
  - Fictional name and date of birth
  - Fictional callback phone number
  never_volunteer:
  - Unasked fictional background details
behavior:
  politeness: normal
  verbosity: normal
  patience: normal
  cooperativeness: normal
target_outcome: The receptionist handles the specific ambiguity or correction without asserting an unsupported
  action or fact.
end_call_when:
- The key ambiguity or requested next step is clearly resolved
- The receptionist explains a limitation and a concrete next step
- The receptionist has ended the conversation
assertions:
  expected_behaviors:
  - Preserves unchanged booking constraints while discussing one field change
  - Makes any required tradeoff explicit before treating it as accepted
  forbidden_behaviors:
  - Changes day or time without making that change clear after the caller explicitly asked to preserve
    it
  failure_signals: []
  ground_truth_notes: Judge only against the explicit caller constraints and demonstrated conversation.
    Do not infer that any external appointment, policy, clinical action or insurance state exists.
max_duration_seconds: 190
