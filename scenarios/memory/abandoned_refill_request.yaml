id: abandoned_refill_request
category: memory
title: Withdrawn intent should not continue executing
difficulty: hard
tags:
- stale-intent/action
- creative
- synthetic
objective: Start a refill inquiry, withdraw it before authorization and switch to an office-hours question.
hypothesis: Probe stale-intent/action; this is a test hypothesis, not an observed defect.
patient:
  name: Owen Clarke
  age: 41
  date_of_birth: '1985-04-12'
  temperament: calm
  speech_notes: Ordinary phone conversation; answer what was asked and clarify uncertainty naturally.
background: Synthetic administrative patient interaction. No real patient data or verified practice policy
  is assumed.
facts_patient_knows:
  current_intent: Office hours only
  withdrawn_intent: Do not submit a refill request
  callback_phone: 805 555 0168
facts_patient_does_not_know:
- Actual appointment availability, office policy, authorization results or insurance coverage unless the
  receptionist establishes them
opening_line: I was going to ask about a refill, but actually please don't send anything yet. I just need
  to know when I can speak to the office.
conversation_strategy:
- Clearly withdraw the refill request.
- Ask only about how and when to contact the office.
- If the receptionist claims a refill request was submitted, ask why because you withdrew it.
information_disclosure:
  volunteer_upfront:
  - I was going to ask about a refill, but actually please don't send anything yet. I just need to know
    when I can speak to the office.
  on_request:
  - Fictional name and date of birth
  - Fictional callback phone number
  never_volunteer:
  - Unasked fictional background details
behavior:
  politeness: normal
  verbosity: normal
  patience: normal
  cooperativeness: normal
target_outcome: The receptionist handles the specific ambiguity or correction without asserting an unsupported
  action or fact.
end_call_when:
- The key ambiguity or requested next step is clearly resolved
- The receptionist explains a limitation and a concrete next step
- The receptionist has ended the conversation
assertions:
  expected_behaviors:
  - Updates the active intent after an explicit withdrawal
  - Answers the office contact-hours question without claiming the withdrawn refill was submitted
  forbidden_behaviors:
  - Claims to submit or confirm a refill after the caller explicitly withdrew that request
  failure_signals: []
  ground_truth_notes: Judge only against the explicit caller constraints and demonstrated conversation.
    Do not infer that any external appointment, policy, clinical action or insurance state exists.
max_duration_seconds: 190
