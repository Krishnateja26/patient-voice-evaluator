id: interrupt_cancel_to_reschedule
category: barge_in
title: Interrupted correction reverses the requested action
difficulty: hard
tags:
- interruption/action-repair
- creative
- synthetic
objective: Correct an initial cancellation request to rescheduling before a cancellation is confirmed.
hypothesis: Probe interruption/action-repair; this is a test hypothesis, not an observed defect.
patient:
  name: Priya Ellis
  age: 41
  date_of_birth: '1985-04-12'
  temperament: calm
  speech_notes: Ordinary phone conversation; answer what was asked and clarify uncertainty naturally.
background: Synthetic administrative patient interaction. No real patient data or verified practice policy
  is assumed.
facts_patient_knows:
  final_intent: Reschedule; preserve appointment until a replacement is agreed
  old_intent: Cancellation considered, not final authorization
  callback_phone: 805 555 0168
facts_patient_does_not_know:
- Actual appointment availability, office policy, authorization results or insurance coverage unless the
  receptionist establishes them
opening_line: I need to change an appointment. I was thinking of canceling it, but I want to see if I
  can move it instead.
conversation_strategy:
- Clearly say that moving the appointment is the current goal.
- If a long cancellation explanation starts, cut in to say not to cancel and to check rescheduling instead.
- Ask whether the original appointment remains in place while alternatives are discussed.
information_disclosure:
  volunteer_upfront:
  - I need to change an appointment. I was thinking of canceling it, but I want to see if I can move it
    instead.
  on_request:
  - Fictional name and date of birth
  - Fictional callback phone number
  never_volunteer:
  - Unasked fictional background details
behavior:
  politeness: normal
  verbosity: normal
  patience: normal
  cooperativeness: normal
  interrupt_agent: true
  interruption_utterance: Sorry, don't cancel it. I want to move it instead.
  interruption_after_seconds: 2.0
  interruption_after_turns: 2
target_outcome: The receptionist handles the specific ambiguity or correction without asserting an unsupported
  action or fact.
end_call_when:
- The key ambiguity or requested next step is clearly resolved
- The receptionist explains a limitation and a concrete next step
- The receptionist has ended the conversation
assertions:
  expected_behaviors:
  - Responds to the correction and preserves the latest intent
  - Clarifies appointment status instead of claiming cancellation after the reversal
  forbidden_behaviors:
  - Confirms cancellation after the caller explicitly asked not to cancel
  - Replays the obsolete cancellation response after the interruption
  failure_signals: []
  ground_truth_notes: Judge only against the explicit caller constraints and demonstrated conversation.
    Do not infer that any external appointment, policy, clinical action or insurance state exists.
max_duration_seconds: 190
